<html>
    <head>
        <link rel="icon" type="image/png" href="./calc.png">
        <style>
            .container {
                display: flex;
                flex-direction: column;
                width: 300px;
                margin: 0 auto;
            }

            .control {
                background-image: linear-gradient(45deg, lightblue 10%, lightgreen 90%);
            }

            #result {
                margin-top: 20px;
                font-size: 18px;
                text-align: center;
                white-space: pre-wrap;
            }

            #fullPage {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            body {
                background-image: linear-gradient(45deg, lightgreen 10%, lightblue 90%);
            }

            .input-wrapper::after {
                content: attr(data-suffix); 
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
                pointer-events: none;
            }
        </style>
        <title>555 Timer Calculator</title>
    </head>
    <body>
        <div id ="fullPage">
            <select class = "control"id="calculationType" style="width:300px; height: 50px; margin-bottom: 1rem;" onchange="toggleDisplay(this.value)">
                <option value = "withResistanceContainer">
                    Solve with Resistance
                </option>
                <option value = "forResistanceContainer">
                    Solve for Resistance
                </option>
            </select>
            <div class="container" id ="withResistanceContainer">
                <input class="control" type="number" id="resistance1" placeholder="Resistance A (Ohms)" style="width:300px; height: 50px;">
                <select class="control" id="resistanceUnit1" style="width:300px; height: 50px;">
                    <option value="1">Ohms</option>
                    <option value="1000">kOhm</option>
                    <option value="1000000">MOhm</option>
                    <option value="1000000000">GOhm</option>
                </select>
                <input class="control" type="number" id="resistance2" placeholder="Resistance B (Ohms)" style="width:300px; height: 50px;">
                <select class="control" id="resistanceUnit2" style="width:300px; height: 50px;">
                    <option value="1">Ohms</option>
                    <option value="1000">kOhm</option>
                    <option value="1000000">MOhm</option>
                    <option value="1000000000">GOhm</option>
                </select>
                <input class="control" type="number" id="capacitance" placeholder="Capacitance" style="width:300px; height: 50px;">
                <select class="control" id="capacitanceUnit" style="width:300px; height: 50px;">
                    <option value="1">F</option>
                    <option value="0.001">mF</option>
                    <option value="0.000001">μF</option>
                    <option value="0.000000001">nF</option>
                    <option value="0.000000000001">pF</option>
                </select>
            </div>
            <div class="container" id="forResistanceContainer" style="display: none;">
                <input class ="control" type ="number" id = "frequency" placeholder = "Frequency" style="width:300px; height: 50px;">
                <select class="control" id="frequencyUnit" style="width:300px; height: 50px;">
                    <option value="0.000000000001">pHz</option>
                    <option value="0.000000001">nHz</option>
                    <option value="0.000001">μHz</option>
                    <option value="0.001">mHz</option>
                    <option value="1" selected>Hz</option>
                    <option value="1000">kHz</option>
                    <option value="1000000">MHz</option>
                    <option value="1000000000">GHz</option>
                </select>
                <div class = "input-wrapper" data-suffix = "%" style="position: relative; display: inline-block;">
                    <input contenteditable = "true" class = "control" type = "number" id = "dutyCycle" placeholder = "Duty Cycle" style="width:300px; height: 50px;">
                </div>
                <input class = "control" type = "number" id = "capacitance2" placeholder = "Capacitance" style="width:300px; height: 50px;">
                <select class="control" id="capacitanceUnit2" style="width:300px; height: 50px;">
                    <option value="1">F</option>
                    <option value="0.001">mF</option>
                    <option value="0.000001">μF</option>
                    <option value="0.000000001">nF</option>
                    <option value="0.000000000001">pF</option>
                </select>
            </div>
            <p id="result"></p>
        </div>
        <script>
            const capacitanceInput2 = document.getElementById('capacitance2');
            capacitanceInput2.addEventListener('input', function() {
                updateDisplay();
            });
            const frequencyInput = document.getElementById('frequency');
            frequencyInput.addEventListener('input', function() {
                updateDisplay();
            });
            const dutyCycleInput = document.getElementById('dutyCycle');
            dutyCycleInput.addEventListener('input', function() {
                updateDisplay();
            });
            const resistanceInput1 = document.getElementById('resistance1');
            resistanceInput1.addEventListener('input', function() {
                updateDisplay();
            });
            const resistanceInput2 = document.getElementById('resistance2');
            resistanceInput2.addEventListener('input', function() {
                updateDisplay();
            });
            const capacitanceInput = document.getElementById('capacitance');
            capacitanceInput.addEventListener('input', function() {
                updateDisplay();
            });
            const resistanceUnitSelect1 = document.getElementById('resistanceUnit1');
            resistanceUnitSelect1.addEventListener('change', function() {
                updateDisplay();
            });
            const resistanceUnitSelect2 = document.getElementById('resistanceUnit2');
            resistanceUnitSelect2.addEventListener('change', function() {
                updateDisplay();
            });
            const capacitanceUnitSelect = document.getElementById('capacitanceUnit');
            capacitanceUnitSelect.addEventListener('change', function() {
                updateDisplay();
            });
            const result = document.getElementById('result');
            function toggleDisplay(selectedValue) {
                document.getElementById('withResistanceContainer').style.display = 'none';
                document.getElementById('forResistanceContainer').style.display = 'none';
                if (selectedValue) {
                    document.getElementById(selectedValue).style.display = 'block';
                }
                result.textContent = "";
            }
            function calculateResistance() {
                let frequency = parseFloat(document.getElementById('frequency').value) * parseFloat(document.getElementById('frequencyUnit').value);
                let dutyCycle = parseFloat(document.getElementById('dutyCycle').value) / 100;
                let capacitance = parseFloat(document.getElementById('capacitance2').value) * parseFloat(document.getElementById('capacitanceUnit2').value);
                let period = 1 / frequency;
                let ra = (2 * dutyCycle - 1) / (0.693 * capacitance * frequency);
                let rb = (1 - dutyCycle) / (0.693 * capacitance * frequency);
                return {
                    ra,
                    rb,
                    raDisplay: formatResistance(ra),
                    rbDisplay: formatResistance(rb)
                };
            }
            function formatResistance(resistance) {
                let displayValue;
                let unit;

                let absResistance = Math.abs(resistance);

                if (absResistance >= 1e9) {
                    displayValue = resistance / 1e9;
                    unit = "GΩ";
                } else if (absResistance >= 1e6) {
                    displayValue = resistance / 1e6;
                    unit = "MΩ";
                } else if (absResistance >= 1e3) {
                    displayValue = resistance / 1e3;
                    unit = "kΩ";
                } else {
                    displayValue = resistance;
                    unit = "Ω";
                }

                return { displayValue, unit };
            }
            function calculatePeriod(){
                let displayValue;
                let unit;
                let period = 0.693 * (parseFloat(document.getElementById('resistance1').value) * parseFloat(document.getElementById('resistanceUnit1').value) + 2 * parseFloat(document.getElementById('resistance2').value) * parseFloat(document.getElementById('resistanceUnit2').value)) * (parseFloat(document.getElementById('capacitance').value) * parseFloat(document.getElementById('capacitanceUnit').value));
                if (period >= 1e12) {
                    displayValue = period / 1e12;
                    unit = "Teraseconds";
                } else if (period >= 1e9) {
                    displayValue = period / 1e9;
                    unit = "Gigaseconds";
                } else if (period >= 1e6) {
                    displayValue = period / 1e6;
                    unit = "Megaseconds";
                } else if (period >= 1e3) {
                    displayValue = period / 1e3;
                    unit = "Kiloseconds";
                } else if (period >= 1) {
                    displayValue = period;
                    unit = "Seconds";
                } else if (period >= 1e-3) {
                    displayValue = period * 1e3;
                    unit = "Milliseconds";
                } else if (period >= 1e-6) {
                    displayValue = period * 1e6;
                    unit = "Microseconds";
                } else if (period >= 1e-9) {
                    displayValue = period * 1e9;
                    unit = "Nanoseconds";
                } else if (period >= 1e-12) {
                    displayValue = period * 1e12;
                    unit = "Picoseconds";
                } else {
                    displayValue = period;
                    unit = "Seconds";
                }
                return {displayValue, unit};
            }
            function calculateFrequency(){
                let displayValue;
                let unit;
                let frequency = 1 / (calculatePeriod().displayValue * {
                    Teraseconds: 1e12,
                    Gigaseconds: 1e9,
                    Megaseconds: 1e6,
                    Kiloseconds: 1e3,
                    Seconds: 1,
                    Milliseconds: 1e-3,
                    Microseconds: 1e-6,
                    Nanoseconds: 1e-9,
                    Picoseconds: 1e-12
                }[calculatePeriod().unit]);
                if (frequency >= 1e12) {
                    displayValue = frequency / 1e12;
                    unit = "THz";
                } else if (frequency >= 1e9) {
                    displayValue = frequency / 1e9;
                    unit = "GHz";
                } else if (frequency >= 1e6) {
                    displayValue = frequency / 1e6;
                    unit = "MHz";
                } else if (frequency >= 1e3) {
                    displayValue = frequency / 1e3;
                    unit = "kHz";
                } else if (frequency >= 1) {
                    displayValue = frequency;
                    unit = "Hz";
                } else if (frequency >= 1e-3) {
                    displayValue = frequency * 1e3;
                    unit = "mHz";
                } else if (frequency >= 1e-6) {
                    displayValue = frequency * 1e6;
                    unit = "µHz";
                } else if (frequency >= 1e-9) {
                    displayValue = frequency * 1e9;
                    unit = "nHz";
                } else if (frequency >= 1e-12) {
                    displayValue = frequency * 1e12;
                    unit = "pHz";
                } else {
                    displayValue = frequency;
                    unit = "Hz";
                }
                return {displayValue, unit};
            }
            function calculateDutyCycle() {
                let resistance1 = parseFloat(document.getElementById('resistance1').value) * parseFloat(document.getElementById('resistanceUnit1').value);
                let resistance2 = parseFloat(document.getElementById('resistance2').value) * parseFloat(document.getElementById('resistanceUnit2').value);
                let dutyCycle = (resistance1 + resistance2) / (resistance1 + 2 * resistance2) * 100;
                return dutyCycle;
            }
            function calculateTimeHigh() {
                let displayValue;
                let unit;
                let timeHigh = calculateDutyCycle() / 100 * (calculatePeriod().displayValue * {
                    Teraseconds: 1e12,
                    Gigaseconds: 1e9,
                    Megaseconds: 1e6,
                    Kiloseconds: 1e3,
                    Seconds: 1,
                    Milliseconds: 1e-3,
                    Microseconds: 1e-6,
                    Nanoseconds: 1e-9,
                    Picoseconds: 1e-12
                }[calculatePeriod().unit]);
                if (timeHigh >= 1e12) {
                    displayValue = timeHigh / 1e12;
                    unit = "Teraseconds";
                } else if (timeHigh >= 1e9) {
                    displayValue = timeHigh / 1e9;
                    unit = "Gigaseconds";
                } else if (timeHigh >= 1e6) {
                    displayValue = timeHigh / 1e6;
                    unit = "Megaseconds";
                } else if (timeHigh >= 1e3) {
                    displayValue = timeHigh / 1e3;
                    unit = "Kiloseconds";
                } else if (timeHigh >= 1) {
                    displayValue = timeHigh;
                    unit = "Seconds";
                } else if (timeHigh >= 1e-3) {
                    displayValue = timeHigh * 1e3;
                    unit = "Milliseconds";
                } else if (timeHigh >= 1e-6) {
                    displayValue = timeHigh * 1e6;
                    unit = "Microseconds";
                } else if (timeHigh >= 1e-9) {
                    displayValue = timeHigh * 1e9;
                    unit = "Nanoseconds";
                } else if (timeHigh >= 1e-12) {
                    displayValue = timeHigh * 1e12;
                    unit = "Picoseconds";
                } else {
                    displayValue = timeHigh;
                    unit = "Seconds";
                }
                return {displayValue, unit};
            }
            function calculateTimeLow() {
                let displayValue;
                let unit;
                let timeLow = (calculatePeriod().displayValue * {
                    Teraseconds: 1e12,
                    Gigaseconds: 1e9,
                    Megaseconds: 1e6,
                    Kiloseconds: 1e3,
                    Seconds: 1,
                    Milliseconds: 1e-3,
                    Microseconds: 1e-6,
                    Nanoseconds: 1e-9,
                    Picoseconds: 1e-12
                }[calculatePeriod().unit]) - (calculateTimeHigh().displayValue * {
                    Teraseconds: 1e12,
                    Gigaseconds: 1e9,
                    Megaseconds: 1e6,
                    Kiloseconds: 1e3,
                    Seconds: 1,
                    Milliseconds: 1e-3,
                    Microseconds: 1e-6,
                    Nanoseconds: 1e-9,
                    Picoseconds: 1e-12
                }[calculateTimeHigh().unit]);
                if (timeLow >= 1e12) {
                    displayValue = timeLow / 1e12;
                    unit = "Teraseconds";
                } else if (timeLow >= 1e9) {
                    displayValue = timeLow / 1e9;
                    unit = "Gigaseconds";
                } else if (timeLow >= 1e6) {
                    displayValue = timeLow / 1e6;
                    unit = "Megaseconds";
                } else if (timeLow >= 1e3) {
                    displayValue = timeLow / 1e3;
                    unit = "Kiloseconds";
                } else if (timeLow >= 1) {
                    displayValue = timeLow;
                    unit = "Seconds";
                } else if (timeLow >= 1e-3) {
                    displayValue = timeLow * 1e3;
                    unit = "Milliseconds";
                } else if (timeLow >= 1e-6) {
                    displayValue = timeLow * 1e6;
                    unit = "Microseconds";
                } else if (timeLow >= 1e-9) {
                    displayValue = timeLow * 1e9;
                    unit = "Nanoseconds";
                } else if (timeLow >= 1e-12) {
                    displayValue = timeLow * 1e12;
                    unit = "Picoseconds";
                } else {
                    displayValue = timeLow;
                    unit = "Seconds";
                }
                return {displayValue, unit};
            }
            function updateDisplay() {
                if (document.getElementById("calculationType").value === "withResistanceContainer") {
                    const r1 = parseFloat(resistanceInput1.value);
                    const r2 = parseFloat(resistanceInput2.value);
                    const c = parseFloat(capacitanceInput.value);
                    if (isNaN(r1) || isNaN(r2) || isNaN(c)) {
                        result.textContent = "Enter all values";
                        return;
                    }
                    const period = calculatePeriod();
                    const frequency = calculateFrequency();
                    const dutyCycle = calculateDutyCycle();
                    const timeHigh = calculateTimeHigh();
                    const timeLow = calculateTimeLow();
                    result.textContent = `Period: ${parseFloat(period.displayValue.toFixed(7))} ${period.unit}\nFrequency: ${parseFloat(frequency.displayValue.toFixed(7))} ${frequency.unit}\nDuty Cycle: ${parseFloat(dutyCycle.toFixed(7))}%\nTime High: ${parseFloat(timeHigh.displayValue.toFixed(7))} ${timeHigh.unit}\nTime Low: ${parseFloat(timeLow.displayValue.toFixed(7))} ${timeLow.unit}\n`;
                } else {
                    const frequency = parseFloat(frequencyInput.value);
                    const dutyCycle = parseFloat(dutyCycleInput.value);
                    const capacitance = parseFloat(capacitanceInput2.value);
                    if (isNaN(frequency) || isNaN(dutyCycle) || isNaN(capacitance)) {
                        result.textContent = "Enter all values";
                        return;
                    }
                    const resistances = calculateResistance();
                    result.textContent = `Resistance A: ${parseFloat(resistances.raDisplay.displayValue.toFixed(7))} ${resistances.raDisplay.unit}\nResistance B: ${parseFloat(resistances.rbDisplay.displayValue.toFixed(7))} ${resistances.rbDisplay.unit}\n`;
                }
            }
        </script>
    </body>
</html>
