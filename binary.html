<html>
    <head>
        <link rel="icon" type="image/png" href="./calc.png">
        <style>
            .container {
                display: flex;
                flex-direction: column;
                width: 300px;
                margin: 0 auto;
            }

            #fullPage {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .control {
                background-image: linear-gradient(45deg, lightblue 10%, lightgreen 90%);
            }

            #result {
                margin-top: 20px;
                font-size: 18px;
                text-align: center;
            }

            body {
                background-image: linear-gradient(45deg, lightgreen 10%, lightblue 90%);
            }
        </style>
        <title>Numbering Systems Calculator</title>
    </head>

    <body>
        <div id = fullPage>
            <select class = "control"id="calculationType" style="width:300px; height: 50px; margin-bottom: 1rem;" onchange="toggleDisplay(this.value)">
                <option value = "forDecimal">
                    Binary to decimal
                </option>

                <option value = "forBinary">
                    Decimal to binary
                </option>

                <option value = "DToO">
                    Decimal to octal
                </option>

                <option value = "OToD">
                    Octal to decimal
                </option>

                <option value = "DToH">
                    Decimal to hexidecimal
                </option>

                <option value = "HToD">
                    Hexidecimal to decimal
                </option>
            </select>

            <div class="container" id = "forDecimal">
                <input class="control" type="text" id="binary" placeholder="Binary Number" style="width:300px; height: 50px;">
            </div>

            <div class="container" id = "forBinary" style = "display: none;">
                <input class="control" type="text" id="decimal" placeholder="Decimal Number" style="width:300px; height: 50px;">
            </div>

            <div class="container" id = "DToO" style = "display: none;">
                <input class="control" type="text" id="decimalO" placeholder="Decimal Number" style="width:300px; height: 50px;">
            </div>

            <div class="container" id = "OToD" style = "display: none;">
                <input class="control" type="text" id="octalD" placeholder="Octal Number" style="width:300px; height: 50px;">
            </div>

            <div class="container" id = "DToH" style = "display: none;">
                <input class="control" type="text" id="decimalH" placeholder="Decimal Number" style="width:300px; height: 50px;">
            </div>

            <div class="container" id = "HToD" style = "display: none;">
                <input class="control" type="text" id="hexD" placeholder="Hexidecimal Number" style="width:300px; height: 50px;">
            </div>
        </div>
        
        <p id="result"></p>

        <script>
            const calculationType = document.getElementById("calculationType");
            const binaryInput = document.getElementById("binary");
            binaryInput.addEventListener('input', function() {
                binaryCalculate();
            });

            const decimalInput = document.getElementById("decimal");
            decimalInput.addEventListener('input', function() {
                decimalCalculate();
            });

            const decimalOInput = document.getElementById("decimalO");
            decimalOInput.addEventListener('input', function() {
                dOctalCalculate();
            });

            const octalDInput = document.getElementById("octalD");
            octalDInput.addEventListener('input', function() {
                octalDCalculate();
            });

            const decimalHInput = document.getElementById("decimalH");
            decimalHInput.addEventListener('input', function() {
                dHexCalculate();
            });

            const hexDInput = document.getElementById("hexD");
            hexDInput.addEventListener('input', function() {
                hexDCalculate();
            });

            const result = document.getElementById("result");
            
            function toggleDisplay(selectedValue) {
                document.getElementById('forBinary').style.display = 'none';
                document.getElementById('forDecimal').style.display = 'none';
                document.getElementById('OToD').style.display = 'none';
                document.getElementById('DToO').style.display = 'none';
                document.getElementById('HToD').style.display = 'none';
                document.getElementById('DToH').style.display = 'none';

                if (selectedValue) {
                    document.getElementById(selectedValue).style.display = 'block';
                }

                result.textContent = "";
            }

            function dOctalCalculate() {
                result.textContent = `The octal number is ${(parseInt(decimalOInput.value)).toString(8)}`;
            }

            function octalDCalculate() {           
                result.textContent = `The decimal number is ${parseInt(octalDInput.value, 8)}`;
            }

            function dHexCalculate() {
                result.textContent = `The hexidecimal number is ${(parseInt(decimalHInput.value)).toString(16).toUpperCase()}`;
            }

            function hexDCalculate() {             
                result.textContent = `The decimal number is ${parseInt(hexDInput.value, 16)}`;
            }

            function binaryCalculate() {
                let binaryList = (binaryInput.value).split("");
                let sum = 0;

                for (let i = binaryList.length - 1; i >= 0; i--) {
                    if (binaryList[i] === "1") { 
                        sum += Math.pow(2, (binaryList.length - 1 - i));
                    }
                }

                result.textContent = `The decimal number is ${sum}`;
            }

            function decimalCalculate() {
                let bin = "";
                let currentNumber = decimalInput.value;

                for (let i = 32; i >= 0; i--) {
                    if (currentNumber >= Math.pow(2, i)) {
                        bin += "1";
                        currentNumber -= Math.pow(2, i);
                    } else {
                        bin += "0";
                    }
                }
                
                bin = bin.replace(/^0+/, '');
                result.textContent = `The binary number is ${bin}`;
            }

        </script>
    </body>
</html>
